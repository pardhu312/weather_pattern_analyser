spring.application.name=weather-api

# Load local .env if available
spring.config.import=optional:file:.env[.properties]

# Server port (Render sets PORT environment variable)
server.port=${PORT:8080}

# Database configuration
# Supports SPRING_DATASOURCE_URL, DB_URL, or DB_HOST/DB_PORT/DB_NAME
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:weather_db}}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# OpenWeather API Key
openweather.api.key=${OPENWEATHER_API_KEY:}

# CORS allowed origins (comma-separated or * for wildcard pattern)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Admin user defaults
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@weather.local}
admin.password=${ADMIN_PASSWORD:Admin123!}

# JWT Secret
jwt.secret=${JWT_SECRET:nu33bwXYTaeIPeuAN9aW1jN1pomUA0pg97Iv4FnW/Cs=}